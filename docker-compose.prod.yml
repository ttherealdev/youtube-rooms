# Production stack, Dokploy-ready.
#
# Dokploy runs Traefik as its ingress and reads the labels below, so this file
# ships no reverse proxy of its own. Deploying anywhere else? Use
# `infra/caddy/Caddyfile` instead and drop the traefik labels.
#
# Required environment (set in Dokploy's UI, or a .env beside this file):
#   DOMAIN, API_DOMAIN, POSTGRES_PASSWORD, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY
# See .env.example for the full list.

name: playercn

x-logging: &logging
  driver: json-file
  options:
    # Unbounded container logs are the most common way a small VPS runs out of
    # disk. Cap them here rather than discovering it at 3am.
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ytroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ytroom}
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    # No published ports, and not on dokploy-network: reachable only by the
    # services in this file.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ytroom}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G }

  redis:
    image: redis:8-alpine
    restart: always
    logging: *logging
    command:
      - redis-server
      - --maxmemory
      - 512mb
      # Everything in Redis is reconstructible from Postgres or from a client
      # reconnect, so evicting the least-recently-used key under pressure is
      # strictly better than refusing writes.
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
      - --appendonly
      - 'no'
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '1', memory: 768M }

  server:
    image: ${SERVER_IMAGE:-playercn-server:latest}
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    restart: always
    logging: *logging
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      APP_ENV: production
      BIND_ADDR: 0.0.0.0:8080
      # Traefik (and Cloudflare in front of it) is the only way in, so the
      # forwarded headers can be believed. Without this every user shares one
      # rate-limit bucket, because the TCP peer is always the proxy.
      TRUST_PROXY_HEADERS: 'true'
      DATABASE_URL: postgres://${POSTGRES_USER:-ytroom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ytroom}
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: https://${API_DOMAIN:?API_DOMAIN is required}
      WEB_ORIGIN: https://${DOMAIN:?DOMAIN is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: 'true'
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    # `--scale server=N` works without further configuration because room
    # ownership is decided by a Redis lease, not by sticky routing (ADR 0010).
    deploy:
      resources:
        limits: { cpus: '2', memory: 1G }
    networks: [internal, dokploy-network]
    labels:
      traefik.enable: 'true'
      # On two networks, Traefik picks a container IP arbitrarily and will
      # happily choose the one it cannot reach. Naming the network is what makes
      # the choice deterministic.
      traefik.docker.network: dokploy-network
      traefik.http.routers.ytroom-api.rule: Host(`${API_DOMAIN}`)
      traefik.http.routers.ytroom-api.entrypoints: websecure
      traefik.http.routers.ytroom-api.tls.certresolver: letsencrypt
      traefik.http.services.ytroom-api.loadbalancer.server.port: '8080'

      # `/metrics` reveals room counts, connection counts and node identity.
      # The app serves it unauthenticated on the assumption that the edge keeps
      # it internal — so the edge has to. A higher-priority router matches the
      # path first and an allowlist limited to loopback rejects everyone.
      # Scrape it from inside the compose network at http://server:8080/metrics.
      traefik.http.routers.ytroom-metrics.rule: Host(`${API_DOMAIN}`) && PathPrefix(`/metrics`)
      traefik.http.routers.ytroom-metrics.entrypoints: websecure
      traefik.http.routers.ytroom-metrics.tls.certresolver: letsencrypt
      traefik.http.routers.ytroom-metrics.priority: '100'
      traefik.http.routers.ytroom-metrics.service: ytroom-api
      traefik.http.routers.ytroom-metrics.middlewares: ytroom-deny-metrics
      traefik.http.middlewares.ytroom-deny-metrics.ipallowlist.sourcerange: '127.0.0.1/32'
      # Long-lived upgrades must outlive the 15s application heartbeat, or the
      # proxy culls healthy sockets on a timer.
      traefik.http.services.ytroom-api.loadbalancer.responseforwarding.flushinterval: '10ms'
      traefik.http.services.ytroom-api.loadbalancer.healthcheck.path: /health/ready
      traefik.http.services.ytroom-api.loadbalancer.healthcheck.interval: '10s'
      # No sticky label here on purpose. `loadbalancer.sticky` is a struct whose
      # only member is `cookie`, not a boolean — setting it to 'false' fails to
      # decode, and Traefik drops *every* label on the container rather than
      # just that one, which silently unregisters the API router. Round-robin
      # with no affinity is already the default (ADR 0010 explains why that is
      # safe here), so asserting it gains nothing.

  web:
    image: ${WEB_IMAGE:-playercn-web:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_API_URL: https://${API_DOMAIN}
        PUBLIC_WS_URL: wss://${API_DOMAIN}
    restart: always
    logging: *logging
    depends_on:
      - server
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }
    networks: [internal, dokploy-network]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.ytroom-web.rule: Host(`${DOMAIN}`)
      traefik.http.routers.ytroom-web.entrypoints: websecure
      traefik.http.routers.ytroom-web.tls.certresolver: letsencrypt
      traefik.http.services.ytroom-web.loadbalancer.server.port: '3000'
      traefik.http.services.ytroom-web.loadbalancer.healthcheck.path: /
      traefik.http.services.ytroom-web.loadbalancer.healthcheck.interval: '15s'

volumes:
  postgres-data:
  redis-data:

networks:
  # Postgres and Redis live here and nowhere else, so nothing outside this file
  # can open a connection to them.
  internal:
    driver: bridge
  # Created by Dokploy's installer, shared by every app on the host. Traefik is
  # on it; that is the only reason it can route to us.
  dokploy-network:
    external: true
