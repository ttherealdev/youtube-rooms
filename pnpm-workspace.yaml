packages:
  - "apps/*"
  - "packages/*"

# Native postinstall scripts we explicitly trust. Everything else stays blocked,
# which is the whole point of the allowlist.
allowBuilds:
  # Next's image optimiser. Ships prebuilt binaries; no C toolchain involved.
  sharp: true

minimumReleaseAgeExclude:
  - lucide-react@1.28.0
  - next@16.2.12

# Next/Tailwind/Biome ship native binaries that need their install scripts to run.
onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
